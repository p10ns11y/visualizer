<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1024" width="100%" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">One App, Two Modes, One Shared State</title>
  <desc id="archDesc">Visualizer architecture: Visual Cockpit Mode and Code Mode share one typed state, with local tool handoff and essential MCP connectors underneath.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    ]]></style>
    <marker id="archArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="archArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#0f766e"/>
    </marker>
    <marker id="archArrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#4338ca"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="1.5" y="1.5" width="1397" height="1021" rx="24" fill="#fafbfc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text class="sans" x="48" y="42" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.8">VISUALIZER ARCHITECTURE</text>
  <text class="sans" x="48" y="74" font-size="30" font-weight="700" fill="#0f172a">One App, Two Modes, One Shared State</text>
  <text class="sans" x="48" y="100" font-size="14" font-weight="400" fill="#64748b">Visual cockpit and Code Mode write the same typed workspace. Flip the toggle to inspect or steer.</text>

  <!-- ===================== TOP: VISUAL COCKPIT ===================== -->
  <rect x="40" y="128" width="590" height="320" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M40 146c0-9.941 8.059-18 18-18h554c9.941 0 18 8.059 18 18v46H40V146Z" fill="#f0fdfa"/>
  <rect x="40" y="128" width="6" height="320" rx="3" fill="#0f766e"/>
  <text class="sans" x="68" y="158" font-size="18" font-weight="700" fill="#115e59">Visual Cockpit Mode</text>
  <text class="sans" x="68" y="178" font-size="12" font-weight="400" fill="#0f766e">Default — speak, sketch, and start a run</text>

  <!-- Cockpit rows -->
  <g id="cockpit-rows">
    <rect x="64" y="196" width="542" height="40" rx="10" fill="#f8fffd" stroke="#ccfbf1"/>
    <rect x="72" y="202" width="28" height="28" rx="7" fill="#ccfbf1"/>
    <!-- mic waves -->
    <path d="M86 210.5v11" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M82 213.2c1.6 2 1.6 5.6 0 7.6" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M90 213.2c-1.6 2-1.6 5.6 0 7.6" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
    <text class="sans" x="112" y="221" font-size="14" font-weight="500" fill="#134e4a" dominant-baseline="middle">Voice and sketch problem cards</text>

    <rect x="64" y="244" width="542" height="40" rx="10" fill="#f8fffd" stroke="#ccfbf1"/>
    <rect x="72" y="250" width="28" height="28" rx="7" fill="#ccfbf1"/>
    <rect x="78.5" y="256" width="15" height="16" rx="2.5" fill="none" stroke="#0f766e" stroke-width="1.6"/>
    <path d="M78.5 260.5h15" stroke="#0f766e" stroke-width="1.6"/>
    <text class="sans" x="112" y="269" font-size="14" font-weight="500" fill="#134e4a" dominant-baseline="middle">Live app mockups</text>

    <rect x="64" y="292" width="542" height="40" rx="10" fill="#f8fffd" stroke="#ccfbf1"/>
    <rect x="72" y="298" width="28" height="28" rx="7" fill="#ccfbf1"/>
    <circle cx="80.5" cy="312" r="3.2" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="91.5" cy="312" r="3.2" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    <path d="M83.8 312h4.4" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M89.2 310.2l2.3 1.8-2.3 1.8" fill="none" stroke="#0f766e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sans" x="112" y="317" font-size="14" font-weight="500" fill="#134e4a" dominant-baseline="middle">Database arrows</text>

    <rect x="64" y="340" width="542" height="40" rx="10" fill="#f8fffd" stroke="#ccfbf1"/>
    <rect x="72" y="346" width="28" height="28" rx="7" fill="#ccfbf1"/>
    <rect x="77.5" y="354.5" width="6" height="6" rx="1.2" fill="#0f766e"/>
    <rect x="85" y="354.5" width="6" height="6" rx="1.2" fill="#4338ca"/>
    <rect x="81.2" y="361.5" width="6" height="6" rx="1.2" fill="#d97706"/>
    <text class="sans" x="112" y="365" font-size="14" font-weight="500" fill="#134e4a" dominant-baseline="middle">Pluggable design systems</text>

    <rect x="64" y="388" width="542" height="40" rx="10" fill="#ecfdf5" stroke="#5eead4"/>
    <rect x="72" y="394" width="28" height="28" rx="7" fill="#0f766e"/>
    <path d="M82.2 401.4l9 6.2-9 6.2Z" fill="#ecfdf5"/>
    <text class="sans" x="112" y="413" font-size="14" font-weight="600" fill="#115e59" dominant-baseline="middle">Build trigger</text>
  </g>

  <!-- ===================== TOGGLE ===================== -->
  <rect x="654" y="198" width="92" height="180" rx="46" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.75"/>
  <text class="sans" x="700" y="236" font-size="10" font-weight="700" fill="#92400e" letter-spacing="1.2" text-anchor="middle">TOGGLE</text>
  <!-- left chevron -->
  <path d="M686 262l-12 10 12 10" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M714 262l12 10-12 10" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans" x="700" y="308" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Code Mode</text>
  <text class="sans" x="700" y="328" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Toggle</text>

  <!-- connectors into toggle -->
  <line x1="630" y1="288" x2="652" y2="288" stroke="#fbbf24" stroke-width="1.75"/>
  <line x1="746" y1="288" x2="768" y2="288" stroke="#fbbf24" stroke-width="1.75"/>

  <!-- ===================== TOP: CODE MODE ===================== -->
  <rect x="770" y="128" width="590" height="320" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M770 146c0-9.941 8.059-18 18-18h554c9.941 0 18 8.059 18 18v46H770V146Z" fill="#eef2ff"/>
  <rect x="1354" y="128" width="6" height="320" rx="3" fill="#4338ca"/>
  <text class="sans" x="798" y="158" font-size="18" font-weight="700" fill="#312e81">Code Mode</text>
  <text class="sans" x="798" y="178" font-size="12" font-weight="400" fill="#4338ca">Inspect the run, schemas, and event log</text>

  <g id="code-rows">
    <rect x="794" y="208" width="542" height="48" rx="10" fill="#f8f9ff" stroke="#c7d2fe"/>
    <rect x="802" y="218" width="28" height="28" rx="7" fill="#c7d2fe"/>
    <text class="sans" x="816" y="232" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle" dominant-baseline="middle">&lt;/&gt;</text>
    <text class="sans" x="842" y="232" font-size="14" font-weight="500" fill="#312e81" dominant-baseline="middle">Live spec and code</text>

    <rect x="794" y="264" width="542" height="48" rx="10" fill="#f8f9ff" stroke="#c7d2fe"/>
    <rect x="802" y="274" width="28" height="28" rx="7" fill="#c7d2fe"/>
    <circle cx="809.5" cy="288" r="2.4" fill="#3730a3"/>
    <circle cx="816" cy="288" r="2.4" fill="#3730a3"/>
    <circle cx="822.5" cy="288" r="2.4" fill="#3730a3"/>
    <path d="M811.8 288h2.8M818.3 288h2.8" stroke="#3730a3" stroke-width="1.3"/>
    <text class="sans" x="842" y="288" font-size="14" font-weight="500" fill="#312e81" dominant-baseline="middle">XState railway</text>

    <rect x="794" y="320" width="542" height="48" rx="10" fill="#f8f9ff" stroke="#c7d2fe"/>
    <rect x="802" y="330" width="28" height="28" rx="7" fill="#c7d2fe"/>
    <rect x="809" y="336.5" width="14" height="10" rx="2" fill="none" stroke="#3730a3" stroke-width="1.5"/>
    <path d="M812 341.5h8M812 344.8h5" stroke="#3730a3" stroke-width="1.2" stroke-linecap="round"/>
    <text class="sans" x="842" y="344" font-size="14" font-weight="500" fill="#312e81" dominant-baseline="middle">WebMCP / MCP schemas</text>

    <rect x="794" y="376" width="542" height="48" rx="10" fill="#f8f9ff" stroke="#c7d2fe"/>
    <rect x="802" y="386" width="28" height="28" rx="7" fill="#c7d2fe"/>
    <path d="M809 393.5h14M809 397.5h14M809 401.5h9" stroke="#3730a3" stroke-width="1.5" stroke-linecap="round"/>
    <text class="sans" x="842" y="400" font-size="14" font-weight="500" fill="#312e81" dominant-baseline="middle">stateVersion event log</text>
  </g>

  <!-- Down arrows from modes into shared state -->
  <line x1="335" y1="448" x2="335" y2="492" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#archArrow)"/>
  <line x1="1065" y1="448" x2="1065" y2="492" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#archArrow)"/>

  <!-- ===================== SHARED STATE ===================== -->
  <rect x="40" y="504" width="1320" height="204" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="40" y="504" width="1320" height="8" rx="4" fill="#4338ca"/>
  <text class="sans" x="64" y="540" font-size="18" font-weight="700" fill="#1e1b4b">One Shared Typed State</text>
  <text class="sans" x="64" y="562" font-size="12" font-weight="400" fill="#64748b">Human and agent read and write the same workspace — protected from overwrite.</text>

  <!-- four modules -->
  <rect x="64" y="578" width="298" height="106" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="sans" x="84" y="608" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="0.8">PRIMITIVES</text>
  <text class="sans" x="84" y="632" font-size="14" font-weight="600" fill="#1e1b4b">@ui-sdk/react</text>
  <text class="sans" x="84" y="654" font-size="12" font-weight="400" fill="#4338ca">Dual-mode primitives</text>

  <rect x="378" y="578" width="298" height="106" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="sans" x="398" y="608" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.8">CONTRACTS</text>
  <text class="sans" x="398" y="632" font-size="14" font-weight="600" fill="#134e4a">adaptate and Zod</text>
  <text class="sans" x="398" y="654" font-size="12" font-weight="400" fill="#0f766e">Typed state contracts</text>

  <rect x="692" y="578" width="298" height="106" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text class="sans" x="712" y="608" font-size="11" font-weight="700" fill="#b45309" letter-spacing="0.8">COLLISION GUARD</text>
  <text class="sans" x="712" y="632" font-size="14" font-weight="600" fill="#78350f">stateVersion</text>
  <text class="sans" x="712" y="654" font-size="12" font-weight="400" fill="#b45309">Locks out conflicting writes</text>

  <rect x="1006" y="578" width="330" height="106" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="1026" y="608" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">BANNER</text>
  <rect x="1026" y="620" width="290" height="44" rx="8" fill="#1e293b"/>
  <circle cx="1046" cy="642" r="5" fill="#34d399"/>
  <text class="sans" x="1060" y="646" font-size="13" font-weight="600" fill="#f8fafc">Agent working  /  Stop</text>

  <!-- Down arrows to bottom -->
  <line x1="365" y1="708" x2="365" y2="748" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#archArrow)"/>
  <line x1="1035" y1="708" x2="1035" y2="748" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#archArrow)"/>

  <!-- ===================== BOTTOM LEFT: LOCAL TOOLS ===================== -->
  <rect x="40" y="760" width="640" height="224" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="sans" x="64" y="796" font-size="16" font-weight="700" fill="#0f172a">Local Tool Handoff</text>
  <text class="sans" x="64" y="818" font-size="12" font-weight="400" fill="#64748b">Coding tasks go to tools already on the machine</text>

  <rect x="64" y="840" width="184" height="116" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="156" y="894" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Cursor</text>
  <text class="sans" x="156" y="916" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Local GUI</text>

  <rect x="260" y="840" width="184" height="116" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="352" y="894" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Claude Code</text>
  <text class="sans" x="352" y="916" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Local CLI or GUI</text>

  <rect x="456" y="840" width="200" height="116" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="556" y="886" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Local CLI</text>
  <text class="sans" x="556" y="908" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">and GUI tools</text>
  <text class="sans" x="556" y="930" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Any harness on hand</text>

  <!-- ===================== BOTTOM RIGHT: MCP ===================== -->
  <rect x="720" y="760" width="640" height="224" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="sans" x="744" y="796" font-size="16" font-weight="700" fill="#0f172a">Essential MCP Connectors</text>
  <text class="sans" x="744" y="818" font-size="12" font-weight="400" fill="#64748b">Scoped to the five essentials — nothing extra</text>

  <rect x="744" y="848" width="184" height="52" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="sans" x="836" y="874" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle" dominant-baseline="middle">GitHub</text>

  <rect x="940" y="848" width="184" height="52" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="sans" x="1032" y="874" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle" dominant-baseline="middle">Vercel</text>

  <rect x="1136" y="848" width="200" height="52" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="sans" x="1236" y="874" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle" dominant-baseline="middle">Greenhouse</text>

  <rect x="744" y="912" width="290" height="52" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="sans" x="889" y="938" font-size="14" font-weight="600" fill="#115e59" text-anchor="middle" dominant-baseline="middle">Workspace</text>

  <rect x="1046" y="912" width="290" height="52" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="sans" x="1191" y="938" font-size="14" font-weight="600" fill="#115e59" text-anchor="middle" dominant-baseline="middle">Ashby</text>
</svg>
