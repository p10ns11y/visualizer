<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" role="img" aria-labelledby="fbTitle fbDesc">
  <title id="fbTitle">3-Tier Brain Degradation and Reuse Map</title>
  <desc id="fbDesc">When tokens run out or cloud access drops, Visualizer degrades from frontier SI to local open-source decision models to deterministic offline code. The base shell reuses Opportunity Finder collision guards, the XState railway, and adaptate plus Zod contracts, with domain apps sitting on top as plugins.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    ]]></style>
    <marker id="fbArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#64748b"/>
    </marker>
    <marker id="fbArrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect x="1.5" y="1.5" width="1397" height="897" rx="24" fill="#fafbfc" stroke="#e2e8f0" stroke-width="2"/>

  <text class="sans" x="48" y="42" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.8">FALLBACK AND REUSE</text>
  <text class="sans" x="48" y="74" font-size="30" font-weight="700" fill="#0f172a">3-Tier Brain Degradation and Reuse Map</text>
  <text class="sans" x="48" y="100" font-size="14" font-weight="400" fill="#64748b">Keep running when tokens run out or cloud access drops. Reuse the Opportunity Finder shell instead of starting over.</text>

  <!-- LEFT PANEL LABEL -->
  <text class="sans" x="48" y="144" font-size="13" font-weight="700" fill="#0f172a">Degradation tiers</text>
  <text class="sans" x="48" y="164" font-size="12" font-weight="400" fill="#64748b">Richer at the top, always-on at the bottom</text>

  <!-- TIER 3 -->
  <rect x="48" y="184" width="640" height="168" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.75"/>
  <rect x="48" y="184" width="8" height="168" rx="4" fill="#4338ca"/>
  <rect x="72" y="204" width="64" height="32" rx="8" fill="#eef2ff"/>
  <text class="sans" x="104" y="225" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">TIER 3</text>
  <rect x="144" y="204" width="154" height="32" rx="8" fill="#eef2ff"/>
  <text class="sans" x="221" y="225" font-size="11" font-weight="600" fill="#4338ca" text-anchor="middle">Cloud, when available</text>
  <text class="sans" x="72" y="264" font-size="18" font-weight="700" fill="#1e1b4b">Frontier SI</text>
  <text class="sans" x="72" y="292" font-size="14" font-weight="400" fill="#334155">Heavy synthesis, architecture, and complex</text>
  <text class="sans" x="72" y="314" font-size="14" font-weight="400" fill="#334155">code generation — used only while access lasts.</text>

  <!-- drop arrow 3 -> 2 -->
  <line x1="368" y1="352" x2="368" y2="390" stroke="#64748b" stroke-width="1.6" marker-end="url(#fbArrow)"/>
  <text class="sans" x="380" y="376" font-size="11" font-weight="600" fill="#64748b">tokens or access drop</text>

  <!-- TIER 2 -->
  <rect x="48" y="402" width="640" height="168" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="1.75"/>
  <rect x="48" y="402" width="8" height="168" rx="4" fill="#d97706"/>
  <rect x="72" y="422" width="64" height="32" rx="8" fill="#fffbeb"/>
  <text class="sans" x="104" y="443" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">TIER 2</text>
  <rect x="144" y="422" width="132" height="32" rx="8" fill="#fffbeb"/>
  <text class="sans" x="210" y="443" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Local / open</text>
  <text class="sans" x="72" y="482" font-size="18" font-weight="700" fill="#78350f">Open-source decision models</text>
  <text class="sans" x="72" y="510" font-size="14" font-weight="400" fill="#334155">Ollama, llama.cpp, or dedicated decision models.</text>
  <text class="sans" x="72" y="532" font-size="14" font-weight="400" fill="#334155">Skill routing, ranking, and drift checks.</text>

  <!-- drop arrow 2 -> 1 -->
  <line x1="368" y1="570" x2="368" y2="608" stroke="#64748b" stroke-width="1.6" marker-end="url(#fbArrow)"/>
  <text class="sans" x="380" y="594" font-size="11" font-weight="600" fill="#64748b">still tighter budget</text>

  <!-- TIER 1 -->
  <rect x="48" y="620" width="640" height="232" rx="16" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.75"/>
  <rect x="48" y="620" width="8" height="232" rx="4" fill="#0f766e"/>
  <rect x="72" y="640" width="64" height="32" rx="8" fill="#ffffff"/>
  <text class="sans" x="104" y="661" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">TIER 1</text>
  <rect x="144" y="640" width="168" height="32" rx="8" fill="#ffffff"/>
  <text class="sans" x="228" y="661" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">0 tokens, offline</text>
  <text class="sans" x="72" y="702" font-size="18" font-weight="700" fill="#134e4a">Deterministic code — always on</text>
  <text class="sans" x="72" y="732" font-size="14" font-weight="400" fill="#334155">Keeps the cockpit alive with no model calls:</text>

  <rect x="72" y="752" width="278" height="72" rx="10" fill="#ffffff" stroke="#99f6e4"/>
  <text class="sans" x="211" y="782" font-size="13" font-weight="600" fill="#115e59" text-anchor="middle">XState statecharts</text>
  <text class="sans" x="211" y="802" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle">Railway transitions</text>

  <rect x="362" y="752" width="150" height="72" rx="10" fill="#ffffff" stroke="#99f6e4"/>
  <text class="sans" x="437" y="782" font-size="13" font-weight="600" fill="#115e59" text-anchor="middle">Schema checks</text>
  <text class="sans" x="437" y="802" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle">Typed validation</text>

  <rect x="524" y="752" width="140" height="72" rx="10" fill="#ffffff" stroke="#99f6e4"/>
  <text class="sans" x="594" y="782" font-size="13" font-weight="600" fill="#115e59" text-anchor="middle">Arithmetic</text>
  <text class="sans" x="594" y="802" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle">Scoring, routing</text>

  <!-- RIGHT PANEL -->
  <text class="sans" x="732" y="144" font-size="13" font-weight="700" fill="#0f172a">Reused from Opportunity Finder</text>
  <text class="sans" x="732" y="164" font-size="12" font-weight="400" fill="#64748b">Lift the shell. Leave domain apps as plugins.</text>

  <rect x="732" y="184" width="620" height="116" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="752" y="208" width="8" height="68" rx="4" fill="#4338ca"/>
  <text class="sans" x="776" y="234" font-size="15" font-weight="700" fill="#1e1b4b">ui-sdk dual-mode collision guards</text>
  <text class="sans" x="776" y="258" font-size="13" font-weight="400" fill="#475569">stateVersion locks plus the Agent working / Stop banner</text>

  <rect x="732" y="316" width="620" height="116" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="752" y="340" width="8" height="68" rx="4" fill="#4338ca"/>
  <text class="sans" x="776" y="366" font-size="15" font-weight="700" fill="#1e1b4b">XState railway backbone</text>
  <text class="sans" x="776" y="390" font-size="13" font-weight="400" fill="#475569">Deterministic transitions for the autopilot loop</text>

  <rect x="732" y="448" width="620" height="116" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <rect x="752" y="472" width="8" height="68" rx="4" fill="#0f766e"/>
  <text class="sans" x="776" y="498" font-size="15" font-weight="700" fill="#134e4a">adaptate + Zod typed contracts</text>
  <text class="sans" x="776" y="522" font-size="13" font-weight="400" fill="#475569">@adaptate/core and @adaptate/utils, shared with Zod</text>

  <!-- arrow into base shell -->
  <line x1="1042" y1="564" x2="1042" y2="608" stroke="#4338ca" stroke-width="1.7" marker-end="url(#fbArrowIndigo)"/>
  <text class="sans" x="1056" y="590" font-size="11" font-weight="700" fill="#4338ca">feeds the base shell</text>

  <!-- Base shell -->
  <rect x="732" y="620" width="620" height="232" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="1.75"/>
  <text class="sans" x="756" y="656" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="1.2">VISUALIZER BASE SHELL</text>
  <text class="sans" x="756" y="684" font-size="18" font-weight="700" fill="#1e1b4b">Cockpit + Code Mode over one shared state</text>
  <text class="sans" x="756" y="710" font-size="13" font-weight="400" fill="#4338ca">The reused shell is the foundation. Domain work stays out of the core.</text>

  <rect x="756" y="732" width="572" height="96" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="sans" x="776" y="764" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8">DOMAIN APPS, ON TOP AS PLUGINS</text>
  <rect x="776" y="780" width="160" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="856" y="800" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Plugin slot</text>
  <rect x="948" y="780" width="160" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="1028" y="800" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Plugin slot</text>
  <rect x="1120" y="780" width="188" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sans" x="1214" y="800" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Plugin slot</text>
</svg>
