<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="100%" role="img" aria-labelledby="pilotTitle pilotDesc">
  <title id="pilotTitle">Pilot / Rail-Driver Autopilot Loop</title>
  <desc id="pilotDesc">Speak or sketch a problem, click Build, let the XState railway drive autopilot, monitor the run, and intervene only on drift. stateVersion pauses the run cleanly, then resume until the artifact is shipped.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    ]]></style>
    <marker id="pilotArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#64748b"/>
    </marker>
    <marker id="pilotArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#0f766e"/>
    </marker>
    <marker id="pilotArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="1.5" y="1.5" width="1397" height="777" rx="24" fill="#fafbfc" stroke="#e2e8f0" stroke-width="2"/>

  <text class="sans" x="48" y="42" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.8">PILOT LOOP</text>
  <text class="sans" x="48" y="74" font-size="30" font-weight="700" fill="#0f172a">Pilot / Rail-Driver Autopilot Loop</text>
  <text class="sans" x="48" y="100" font-size="14" font-weight="400" fill="#64748b">Start the run. Watch it drive. Steer only when it drifts.</text>

  <!-- Track under the forward rail, visible in the gaps -->
  <line x1="86" y1="248" x2="1230" y2="248" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <line x1="86" y1="248" x2="1230" y2="248" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 10"/>

  <!-- STEP 1  48-258 -->
  <rect x="48" y="140" width="210" height="216" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="76" cy="168" r="16" fill="#0f766e"/>
  <text class="sans" x="76" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text class="sans" x="102" y="174" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.8">INPUT</text>
  <text class="sans" x="68" y="216" font-size="16" font-weight="700" fill="#0f172a">Speak or sketch</text>
  <text class="sans" x="68" y="238" font-size="16" font-weight="700" fill="#0f172a">the problem</text>
  <text class="sans" x="68" y="270" font-size="12" font-weight="400" fill="#64748b">Voice, rough shapes,</text>
  <text class="sans" x="68" y="288" font-size="12" font-weight="400" fill="#64748b">and problem cards</text>

  <line x1="258" y1="248" x2="288" y2="248" stroke="#64748b" stroke-width="1.75" marker-end="url(#pilotArrow)"/>

  <!-- STEP 2  300-488 -->
  <rect x="300" y="140" width="188" height="216" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="328" cy="168" r="16" fill="#0f766e"/>
  <text class="sans" x="328" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text class="sans" x="354" y="174" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.8">START</text>
  <text class="sans" x="320" y="224" font-size="16" font-weight="700" fill="#0f172a">Click Build</text>
  <text class="sans" x="320" y="270" font-size="12" font-weight="400" fill="#64748b">Hand the run to</text>
  <text class="sans" x="320" y="288" font-size="12" font-weight="400" fill="#64748b">autopilot</text>

  <line x1="488" y1="248" x2="518" y2="248" stroke="#64748b" stroke-width="1.75" marker-end="url(#pilotArrow)"/>

  <!-- STEP 3  530-750 -->
  <rect x="530" y="140" width="220" height="216" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="558" cy="168" r="16" fill="#4338ca"/>
  <text class="sans" x="558" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text class="sans" x="584" y="174" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="0.8">RAILWAY</text>
  <text class="sans" x="550" y="216" font-size="16" font-weight="700" fill="#0f172a">XState railway</text>
  <text class="sans" x="550" y="238" font-size="16" font-weight="700" fill="#0f172a">drives autopilot</text>
  <text class="sans" x="550" y="270" font-size="12" font-weight="400" fill="#64748b">Deterministic steps</text>
  <text class="sans" x="550" y="288" font-size="12" font-weight="400" fill="#64748b">carry the work forward</text>

  <line x1="750" y1="248" x2="780" y2="248" stroke="#64748b" stroke-width="1.75" marker-end="url(#pilotArrow)"/>

  <!-- STEP 4  792-1002 -->
  <rect x="792" y="140" width="210" height="216" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.75"/>
  <circle cx="820" cy="168" r="16" fill="#4338ca"/>
  <text class="sans" x="820" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text class="sans" x="846" y="174" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="0.8">WATCH</text>
  <text class="sans" x="812" y="216" font-size="16" font-weight="700" fill="#0f172a">Monitor the run</text>
  <text class="sans" x="812" y="270" font-size="12" font-weight="400" fill="#64748b">Stay on the rail unless</text>
  <text class="sans" x="812" y="288" font-size="12" font-weight="400" fill="#64748b">the work starts to drift</text>

  <line x1="1002" y1="248" x2="1048" y2="248" stroke="#0f766e" stroke-width="1.75" marker-end="url(#pilotArrowTeal)"/>
  <text class="sans" x="1025" y="232" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">No drift</text>

  <!-- STEP 5  1060-1280 -->
  <rect x="1060" y="140" width="220" height="216" rx="16" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.75"/>
  <circle cx="1088" cy="168" r="16" fill="#0f766e"/>
  <text class="sans" x="1088" y="173" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text class="sans" x="1114" y="174" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.8">OUTCOME</text>
  <text class="sans" x="1080" y="216" font-size="16" font-weight="700" fill="#065f46">Shipped artifact</text>
  <text class="sans" x="1080" y="270" font-size="12" font-weight="400" fill="#047857">The working app leaves</text>
  <text class="sans" x="1080" y="288" font-size="12" font-weight="400" fill="#047857">the cockpit</text>

  <!-- Drop from Monitor on drift. Monitor center x = 897 -->
  <path d="M897 356v32" stroke="#b45309" stroke-width="1.75" fill="none" marker-end="url(#pilotArrowAmber)"/>
  <text class="sans" x="910" y="380" font-size="11" font-weight="700" fill="#b45309">Drift or obstacle?</text>

  <!-- Bottom intervention rail: ends at 1224, leaving a clear right channel -->
  <rect x="48" y="408" width="1176" height="324" rx="18" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>

  <text class="sans" x="72" y="440" font-size="11" font-weight="700" fill="#92400e" letter-spacing="1.4">YES — STEER, THEN RETURN TO THE RAIL</text>

  <!-- Intervene card -->
  <rect x="72" y="460" width="760" height="248" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="108" cy="496" r="16" fill="#b45309"/>
  <text class="sans" x="108" y="501" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text class="sans" x="136" y="502" font-size="18" font-weight="700" fill="#78350f">Human intervenes</text>
  <text class="sans" x="96" y="548" font-size="14" font-weight="500" fill="#334155">Step in from Visual Cockpit Mode or Code Mode.</text>
  <text class="sans" x="96" y="572" font-size="14" font-weight="500" fill="#334155">stateVersion pauses autopilot cleanly — zero overwrite.</text>

  <rect x="96" y="604" width="328" height="80" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="sans" x="260" y="636" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="0.6">COCKPIT</text>
  <text class="sans" x="260" y="658" font-size="13" font-weight="600" fill="#115e59" text-anchor="middle">Steer with visual controls</text>

  <rect x="436" y="604" width="368" height="80" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="sans" x="620" y="636" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle" letter-spacing="0.6">CODE MODE</text>
  <text class="sans" x="620" y="658" font-size="13" font-weight="600" fill="#312e81" text-anchor="middle">Inspect state, schemas, and the log</text>

  <line x1="832" y1="584" x2="868" y2="584" stroke="#b45309" stroke-width="1.75" marker-end="url(#pilotArrowAmber)"/>

  <!-- Resume  880-1200  (inside panel ending at 1224) -->
  <rect x="880" y="496" width="320" height="176" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <g transform="translate(904,516)">
    <circle cx="16" cy="16" r="16" fill="#b45309"/>
    <path d="M16 8.5a7.5 7.5 0 1 1-5.3 12.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M16 5.8v5.2h-5.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="sans" x="948" y="538" font-size="16" font-weight="700" fill="#78350f">Resume</text>
  <text class="sans" x="904" y="580" font-size="13" font-weight="500" fill="#334155">Return to Monitor.</text>
  <text class="sans" x="904" y="602" font-size="13" font-weight="500" fill="#334155">Autopilot continues from</text>
  <text class="sans" x="904" y="624" font-size="13" font-weight="500" fill="#334155">the paused state.</text>

  <!-- Loop around the far right, clear of the shipped card (ends x=1280) -->
  <path d="M1200 584 H1310 V118 H897 V138" fill="none" stroke="#b45309" stroke-width="1.75" marker-end="url(#pilotArrowAmber)"/>
  <text class="sans" x="1320" y="360" font-size="11" font-weight="700" fill="#b45309">back to</text>
  <text class="sans" x="1320" y="376" font-size="11" font-weight="700" fill="#b45309">Monitor</text>
</svg>
